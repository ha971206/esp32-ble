<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qk98 Keyboard 타이퍼</title>
    <style>
        /* 다크 모드 테마 설정 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 20px; 
            max-width: 500px; 
            margin: 0 auto; 
            background-color: #121212; 
            color: #e0e0e0;
        }
        .card { 
            background: #1e1e1e; 
            padding: 22px; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
            border: 1px solid #2c2c2e;
        }
        h2 { 
            margin-top: 0; 
            font-size: 20px; 
            color: #ffffff; 
            display: flex;
            align-items: center;
            gap: 8px;
        }
        textarea { 
            width: 100%; 
            height: 180px; 
            padding: 12px; 
            border: 1px solid #3a3a3c; 
            border-radius: 10px; 
            font-size: 16px; 
            box-sizing: border-box; 
            margin: 12px 0; 
            resize: vertical; 
            background-color: #2c2c2e; 
            color: #ffffff;
        }
        textarea::placeholder {
            color: #8e8e93;
        }
        textarea:focus {
            outline: none;
            border-color: #0a84ff;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            font-size: 16px; 
            font-weight: bold; 
            color: white; 
            background-color: #0a84ff; 
            border: none; 
            border-radius: 10px; 
            margin-bottom: 10px; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        button:active { 
            background-color: #0056b3; 
        }
        #status { 
            font-size: 14px; 
            color: #a1a1a6; 
            margin-bottom: 16px; 
            font-weight: 500; 
            padding: 8px 12px;
            background: #2c2c2e;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>⌨️ qk98 Keyboard</h2>
        <div id="status">상태: 연결 안 됨</div>
        <button onclick="connectBLE()">1. qk98 블루투스 연결</button>
        <textarea id="inputText" placeholder="카톡 장문이나 한글 텍스트를 붙여넣으세요..."></textarea>
        <button onclick="sendText()" style="background-color: #30d158; color: #000;">2. PC로 전송하기</button>
    </div>

    <script>
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHARACTERISTIC_RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
        let rxCharacteristic = null;

        // 두벌식 한글 자모 맵핑
        const CHO = ["r","R","s","e","E","f","a","q","Q","t","T","d","w","W","c","z","x","v","g"];
        const JOUNG = ["k","o","i","O","j","p","u","P","h","hk","ho","hl","nj","nj","nl","b","m","ml","l"];
        const JONG = ["","r","R","rt","s","sw","sg","e","f","fr","fa","fq","ft","fx","fv","fg","a","q","qt","t","T","d","w","c","z","x","v","g"];

        function korToEng(text) {
            let result = "";
            for (let i = 0; i < text.length; i++) {
                let code = text.charCodeAt(i);
                if (code >= 0xAC00 && code <= 0xD7A3) {
                    code -= 0xAC00;
                    let jong = code % 28;
                    let joung = ((code - jong) / 28) % 21;
                    let cho = parseInt(((code - jong) / 28) / 21);
                    result += CHO[cho] + JOUNG[joung] + JONG[jong];
                } else {
                    result += text[i];
                }
            }
            return result;
        }

        async function connectBLE() {
            try {
                document.getElementById('status').innerText = "상태: 기기 검색 중...";
                const device = await navigator.bluetooth.requestDevice({
                    // 'qk98'로 시작하는 기기 자동 검색
                    filters: [{ namePrefix: 'qk98' }, { namePrefix: 'esp32' }],
                    optionalServices: [SERVICE_UUID]
                });
                document.getElementById('status').innerText = "상태: 연결 중...";
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_RX_UUID);
                document.getElementById('status').innerText = "상태: ✅ 연결됨 (" + device.name + ")";
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "❌ 연결 실패: " + error.message;
            }
        }

        async function sendText() {
            if (!rxCharacteristic) {
                alert("먼저 [1. qk98 블루투스 연결] 버튼을 눌러주세요!");
                return;
            }

            const rawText = document.getElementById('inputText').value;
            if (!rawText) return;

            document.getElementById('status').innerText = "상태: ⏳ 전송 중...";

            const hasKorean = /[ㄱ-ㅎ|ㅏ-ㅣ|가-힣]/.test(rawText);
            let convertedText = korToEng(rawText);

            if (hasKorean) {
                convertedText = "\x01" + convertedText + "\x01";
            }

            const encoder = new TextEncoder();
            const data = encoder.encode(convertedText);
            
            const chunkSize = 20; 
            for (let i = 0; i < data.length; i += chunkSize) {
                const chunk = data.slice(i, i + chunkSize);
                await rxCharacteristic.writeValue(chunk);
                await new Promise(resolve => setTimeout(resolve, 60));
            }

            document.getElementById('status').innerText = "상태: ✅ 전송 완료!";
        }
    </script>
</body>
</html>
