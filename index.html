<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 BLE Controller</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; background-color: #f2f2f7; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; font-size: 20px; }
        textarea { width: 100%; height: 180px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; margin: 10px 0; }
        button { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; color: white; background-color: #007aff; border: none; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
        button:active { background-color: #0056b3; }
        #status { font-size: 14px; color: #666; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ESP32 BLE 타이핑 전송기</h2>
        <div id="status">상태: 연결 안 됨</div>
        <button onclick="connectBLE()">1. ESP32 블루투스 연결</button>
        <textarea id="inputText" placeholder="카톡 장문이나 코드를 여기에 붙여넣으세요..."></textarea>
        <button onclick="sendText()" style="background-color: #34c759;">2. PC로 전송하기</button>
    </div>

    <script>
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHARACTERISTIC_RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

        let rxCharacteristic = null;

        async function connectBLE() {
            try {
                document.getElementById('status').innerText = "상태: 기기 검색 중...";
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ESP32-S3 Keyboard' }],
                    optionalServices: [SERVICE_UUID]
                });

                document.getElementById('status').innerText = "상태: 연결 중...";
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_RX_UUID);

                document.getElementById('status').innerText = "상태: ✅ 연결됨 (" + device.name + ")";
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "❌ 연결 실패: " + error.message;
            }
        }

        async function sendText() {
            if (!rxCharacteristic) {
                alert("먼저 [1. ESP32 블루투스 연결] 버튼을 눌러주세요!");
                return;
            }

            const text = document.getElementById('inputText').value;
            if (!text) {
                alert("전송할 텍스트를 입력해주세요.");
                return;
            }

            document.getElementById('status').innerText = "상태: ⏳ 전송 중...";

            // UTF-8 바이트 인코딩 (한글, 줄바꿈, 탭 문자 완벽 보존)
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            
            // 80바이트 단위로 자동 쪼개서 40ms 간격으로 전송 (Resources are insufficient 에러 방지)
            const chunkSize = 80; 
            for (let i = 0; i < data.length; i += chunkSize) {
                const chunk = data.slice(i, i + chunkSize);
                await rxCharacteristic.writeValue(chunk);
                await new Promise(resolve => setTimeout(resolve, 40)); 
            }

            document.getElementById('status').innerText = "상태: ✅ 전송 완료!";
        }
    </script>
</body>
</html>
